name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIPENV_VENV_IN_PROJECT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pipenv
          cache-dependency-path: Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv==2026.6.2

      - name: Verify dependency lock
        run: python -m pipenv verify

      - name: Install locked dependencies
        run: python -m pipenv sync --dev

      - name: Run offline tests
        run: python -m pipenv run python -m pytest -q

      - name: Compile application modules
        run: python -m pipenv run python -m py_compile config.py ai_agent.py backend.py frontend.py
